<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchMind AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white">MatchMind AI Hub</h1>
                <p class="text-slate-400 text-sm mt-1">სპორტული ანალიტიკა და კოეფიციენტების მონიტორინგი (AI Powered)</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="sync-status" class="text-xs font-medium text-emerald-400">Live Sync Active</span>
            </div>
        </header>

        <!-- Sport Navigation -->
        <div class="flex gap-3 mb-6">
            <button onclick="setSport('football')" id="btn-football" class="sport-tab px-5 py-2.5 rounded-xl font-semibold text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30">ფეხბურთი</button>
            <button onclick="setSport('ufc')" id="btn-ufc" class="sport-tab px-5 py-2.5 rounded-xl font-semibold text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800">UFC / MMA</button>
            <button onclick="setSport('f1')" id="btn-f1" class="sport-tab px-5 py-2.5 rounded-xl font-semibold text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800">Formula 1</button>
        </div>

        <!-- Status Filter (For Football / UFC) -->
        <div id="status-filters" class="flex gap-2 mb-6">
            <button onclick="setStatus('upcoming')" id="status-upcoming" class="status-tab px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-white transition">მომავალი</button>
            <button onclick="setStatus('live')" id="status-live" class="status-tab px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:text-white transition">ლაივი</button>
            <button onclick="setStatus('finished')" id="status-finished" class="status-tab px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:text-white transition">დასრულებული</button>
        </div>

        <!-- Data Container -->
        <div id="content-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Cards will render here -->
        </div>
    </div>

    <script>
        let currentSport = 'football';
        let currentStatus = 'upcoming';
        let globalData = null;

        async function fetchData() {
            try {
                const res = await fetch('/api/sports/live');
                const json = await res.json();
                if (json.status === 'success') {
                    globalData = json.data;
                    render();
                }
            } catch (err) {
                console.error("Error fetching live data:", err);
            }
        }

        function setSport(sport) {
            currentSport = sport;
            document.querySelectorAll('.sport-tab').forEach(b => {
                b.className = "sport-tab px-5 py-2.5 rounded-xl font-semibold text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800";
            });
            document.getElementById(`btn-${sport}`).className = "sport-tab px-5 py-2.5 rounded-xl font-semibold text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30";
            
            const sf = document.getElementById('status-filters');
            sf.style.display = sport === 'f1' ? 'none' : 'flex';
            render();
        }

        function setStatus(status) {
            currentStatus = status;
            document.querySelectorAll('.status-tab').forEach(b => {
                b.className = "status-tab px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:text-white transition";
            });
            document.getElementById(`status-${status}`).className = "status-tab px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-white transition";
            render();
        }

        function render() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (!globalData) {
                container.innerHTML = '<div class="col-span-2 text-center py-12 text-slate-500">ინფორმაცია იტვირთება...</div>';
                return;
            }

            if (currentSport === 'f1') {
                const f1List = globalData.f1 || [];
                if (f1List.length === 0) {
                    container.innerHTML = '<div class="col-span-2 text-center py-12 text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800/60">ინფორმაცია არ მოიძებნა.</div>';
                    return;
                }
                f1List.forEach(item => {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex justify-between items-center">
                            <div>
                                <span class="text-xs text-blue-400 font-semibold uppercase tracking-wider">${item.session || 'F1 Session'} (${item.circuit || ''})</span>
                                <h3 class="text-lg font-bold text-white mt-1">#${item.pos} - ${item.driver}</h3>
                                <p class="text-slate-400 text-xs">${item.team}</p>
                            </div>
                        </div>
                    `;
                });
                return;
            }

            const sportData = globalData[currentSport] || { live: [], upcoming: [], finished: [] };
            const list = sportData[currentStatus] || [];

            if (list.length === 0) {
                container.innerHTML = '<div class="col-span-2 text-center py-12 text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800/60">ინფორმაცია არ მოიძებნა.</div>';
                return;
            }

            list.forEach(match => {
                if (currentSport === 'football') {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <div class="flex justify-between items-center text-xs text-slate-400 mb-3">
                                <span class="bg-slate-800 px-2.5 py-1 rounded-md text-slate-300 font-medium">${match.league}</span>
                                <span>${match.date} ${match.time}</span>
                            </div>
                            <div class="flex justify-between items-center my-4 font-bold text-lg text-white">
                                <span class="w-2/5 text-left truncate">${match.home}</span>
                                <span class="text-slate-500 text-sm font-normal">VS</span>
                                <span class="w-2/5 text-right truncate">${match.away}</span>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                                <div class="text-slate-400">პროგნოზი (AI): <span class="text-emerald-400 font-bold">${(match.home_prob * 100).toFixed(0)}% / ${(match.away_prob * 100).toFixed(0)}%</span></div>
                                <div class="bg-slate-800/80 px-2 py-1 rounded text-slate-300">კუშები: ${match.home_odd} / ${match.away_odd}</div>
                            </div>
                        </div>
                    `;
                } else if (currentSport === 'ufc') {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <div class="flex justify-between items-center text-xs text-slate-400 mb-3">
                                <span class="bg-slate-800 px-2.5 py-1 rounded-md text-slate-300 font-medium">${match.event}</span>
                                <span>${match.date}</span>
                            </div>
                            <div class="flex justify-between items-center my-4 font-bold text-base text-white">
                                <span class="w-2/5 text-left">${match.fighter_a}</span>
                                <span class="text-slate-500 text-xs font-normal">VS</span>
                                <span class="w-2/5 text-right">${match.fighter_b}</span>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                                <div class="text-slate-400">შანსი: <span class="text-emerald-400 font-bold">${(match.home_prob * 100).toFixed(0)}% / ${(match.away_prob * 100).toFixed(0)}%</span></div>
                                <div class="bg-slate-800/80 px-2 py-1 rounded text-slate-300">კუში: ${match.home_odd} / ${match.away_odd}</div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
